# Every push to main: Godot exports a web build in the cloud and publishes it
# to GitHub Pages, so the newest version is always one tap away on your phone.
name: Build and deploy to phone

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Install export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: godot --headless --import || true

      - name: Export web build
        shell: bash
        run: |
          mkdir -v -p build/web
          set +e
          godot --headless --export-release "Web" build/web/index.html 2>&1 | tee export.log
          code=${PIPESTATUS[0]}
          # Surface Godot's errors as annotations so they show up without opening the raw log.
          { grep -iE "error|failed|cannot|invalid" export.log || true; } | head -20 | while IFS= read -r line; do
            echo "::warning title=Godot export::${line}"
          done
          echo "::notice title=Build output::exit=${code}; files: $(ls build/web 2>&1 | tr '\n' ' ')"
          if [ ! -f build/web/index.html ]; then
            tail -15 export.log | while IFS= read -r line; do echo "::error title=Godot log tail::${line}"; done
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
